<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Progress Dialog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #020713;
            --bg-panel: #07111F;
            --bg-panel-2: #0A1728;

            --cyan: #00E5FF;
            --cyan-soft: #65F4FF;
            --cyan-dark: #009CB5;

            --pink: #FF2D95;
            --pink-soft: #FF65B7;

            --green: #42F59E;
            --green-dark: #00C875;

            --text-main: #F4FBFF;
            --text-secondary: #9EB7C7;
            --text-muted: #607988;

            --track: #14283A;
            --line: rgba(0, 229, 255, 0.18);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(0, 229, 255, 0.08) 0%,
                    rgba(0, 229, 255, 0.025) 28%,
                    transparent 55%
                ),
                radial-gradient(
                    circle at 75% 20%,
                    rgba(255, 45, 149, 0.07) 0%,
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #06101D 0%,
                    var(--bg-deep) 100%
                );

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: var(--text-main);
        }

        .dialog-container {
            position: relative;

            width: 100%;
            height: 100%;

            padding: 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.70),
                    rgba(2, 7, 19, 0.92)
                );
        }

        /*
         * Brillo decorativo superior.
         */
        .dialog-container::before {
            content: '';

            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;

            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--cyan),
                var(--pink),
                transparent
            );

            box-shadow:
                0 0 12px rgba(0, 229, 255, 0.8),
                0 0 22px rgba(255, 45, 149, 0.35);
        }

        /*
         * Brillo ambiental detrás del círculo.
         */
        .dialog-container::after {
            content: '';

            position: absolute;

            width: 390px;
            height: 390px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 229, 255, 0.07) 0%,
                    rgba(0, 229, 255, 0.025) 38%,
                    transparent 70%
                );

            filter: blur(8px);

            pointer-events: none;
        }

        .file-name {
            position: relative;
            z-index: 2;

            color: var(--text-secondary);

            font-size: 15px;
            font-weight: 600;

            letter-spacing: 1.6px;

            margin-bottom: 12px;

            text-shadow:
                0 0 8px rgba(0, 229, 255, 0.15);
        }

        .progress-circle-container {
            position: relative;
            z-index: 2;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 18px 0;
        }

        svg {
            width: 400px;
            height: 400px;

            transform: rotate(-90deg);

            margin: 15px 0;

            overflow: visible;

            filter:
                drop-shadow(0 0 5px rgba(0, 229, 255, 0.18));
        }

        .progress-background {
            fill: none;

            stroke: var(--track);
            stroke-width: 18;

            stroke-linecap: round;
        }

        /*
         * Segundo aro muy tenue para dar profundidad.
         */
        .progress-outline {
            fill: none;

            stroke: rgba(0, 229, 255, 0.09);
            stroke-width: 1;

            stroke-dasharray: 3 5;
        }

        .progress-fill {
            fill: none;

            stroke-width: 18;
            stroke-linecap: round;

            stroke-dasharray: 471.24;
            stroke-dashoffset: 471.24;

            transition:
                stroke-dashoffset 0.3s ease,
                filter 0.3s ease;

            stroke: url(#progressGradient);

            filter:
                drop-shadow(0 0 5px rgba(0, 229, 255, 0.75))
                drop-shadow(0 0 10px rgba(255, 45, 149, 0.30));
        }

        .progress-fill.completed {
            stroke: url(#completedGradient);

            filter:
                drop-shadow(0 0 6px rgba(66, 245, 158, 0.85))
                drop-shadow(0 0 13px rgba(0, 200, 117, 0.35));
        }

        .progress-text {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            z-index: 3;
        }

        .progress-label {
            color: var(--text-secondary);

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 14px;

            min-width: 190px;
            height: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-transform: uppercase;
        }

        .progress-label.completed {
            color: var(--green);

            text-shadow:
                0 0 8px rgba(66, 245, 158, 0.45);
        }

        .dot {
            display: inline-block;

            width: 5px;
            height: 5px;

            background-color: var(--cyan);

            border-radius: 50%;

            margin: 0 3px;

            box-shadow:
                0 0 5px rgba(0, 229, 255, 0.8);

            animation: blink 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .progress-label.completed .dot {
            display: none;
        }

        @keyframes blink {
            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: scale(0.85);
            }

            30% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .progress-percentage {
            color: var(--cyan);

            font-size: 92px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: -4px;

            text-shadow:
                0 0 8px rgba(0, 229, 255, 0.60),
                0 0 18px rgba(0, 229, 255, 0.20);
        }

        .progress-text.completed .progress-percentage {
            color: var(--green);

            text-shadow:
                0 0 8px rgba(66, 245, 158, 0.65),
                0 0 18px rgba(66, 245, 158, 0.20);
        }

        .separator {
            position: relative;
            z-index: 2;

            width: min(420px, 75%);

            height: 1px;

            margin: 22px 0;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 229, 255, 0.4),
                rgba(255, 45, 149, 0.25),
                transparent
            );

            box-shadow:
                0 0 7px rgba(0, 229, 255, 0.15);
        }

        .info-text {
            position: relative;
            z-index: 2;

            color: var(--text-muted);

            font-size: 12px;
            font-weight: 500;

            letter-spacing: 0.8px;

            margin-bottom: 0;
        }

        /*
         * Responsive.
         */
        @media (max-width: 480px) {

            .dialog-container {
                padding: 20px;
            }

            .dialog-container::after {
                width: 290px;
                height: 290px;
            }

            svg {
                width: 300px;
                height: 300px;
            }

            .progress-percentage {
                font-size: 68px;
            }

            .progress-label {
                font-size: 12px;
            }

            .file-name {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="dialog-container">

    <div
            class="file-name"
            id="fileName"
    >
        FingerDance.apk
    </div>

    <div class="progress-circle-container">

        <svg viewBox="0 0 200 200">

            <defs>

                <!--
                    Progreso normal:
                    Cyan -> Cyan claro -> Magenta.
                -->
                <linearGradient
                        id="progressGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                >
                    <stop
                            offset="0%"
                            style="
                                stop-color:#00E5FF;
                                stop-opacity:1
                            "
                    />

                    <stop
                            offset="58%"
                            style="
                                stop-color:#65F4FF;
                                stop-opacity:1
                            "
                    />

                    <stop
                            offset="100%"
                            style="
                                stop-color:#FF2D95;
                                stop-opacity:1
                            "
                    />

                </linearGradient>

                <!--
                    Completado.
                -->
                <linearGradient
                        id="completedGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                >
                    <stop
                            offset="0%"
                            style="
                                stop-color:#42F59E;
                                stop-opacity:1
                            "
                    />

                    <stop
                            offset="100%"
                            style="
                                stop-color:#00C875;
                                stop-opacity:1
                            "
                    />

                </linearGradient>

            </defs>

            <!-- Aro exterior decorativo -->
            <circle
                    class="progress-outline"
                    cx="100"
                    cy="100"
                    r="88"
            ></circle>

            <!-- Círculo de fondo -->
            <circle
                    class="progress-background"
                    cx="100"
                    cy="100"
                    r="75"
            ></circle>

            <!-- Círculo de progreso -->
            <circle
                    class="progress-fill"
                    id="progressCircle"
                    cx="100"
                    cy="100"
                    r="75"
            ></circle>

        </svg>

        <div
                class="progress-text"
                id="progressText"
        >

            <div
                    class="progress-label"
                    id="progressLabel"
            >

                    <span id="labelText">
                        Descargando
                    </span>

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

            <div
                    class="progress-percentage"
                    id="progressPercentage"
            >
                0%
            </div>

        </div>

    </div>

    <div class="separator"></div>

    <div class="info-text">
        Por favor, no cierres la aplicación
    </div>

</div>

<script>

    const radius = 75;
    const circumference = 2 * Math.PI * radius;

    const progressCircle =
        document.getElementById('progressCircle');

    const progressPercentage =
        document.getElementById('progressPercentage');

    const fileNameElement =
        document.getElementById('fileName');

    const progressLabel =
        document.getElementById('progressLabel');

    const progressText =
        document.getElementById('progressText');

    const labelText =
        document.getElementById('labelText');

    progressCircle.style.strokeDasharray =
        circumference;

    progressCircle.style.strokeDashoffset =
        circumference;

    /*
     * Función llamada desde Android.
     */
    function updateProgress(progress) {

        progress = Math.max(
            0,
            Math.min(100, Number(progress))
        );

        const offset =
            circumference -
            (progress / 100) * circumference;

        progressCircle.style.strokeDashoffset =
            offset;

        progressPercentage.textContent =
            Math.round(progress) + '%';

        if (progress >= 100) {

            progressCircle
                .classList
                .add('completed');

            progressLabel
                .classList
                .add('completed');

            progressText
                .classList
                .add('completed');

            labelText.textContent =
                '¡Completado!';

        } else {

            progressCircle
                .classList
                .remove('completed');

            progressLabel
                .classList
                .remove('completed');

            progressText
                .classList
                .remove('completed');

            labelText.textContent =
                'Descargando';
        }
    }

    /*
     * Nombre del archivo desde Android.
     */
    function setFileName(name) {

        fileNameElement.textContent =
            name;
    }

</script>

</body>
</html>
