<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Descargando</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #020713;
            --bg-panel: #07111F;
            --cyan: #00E5FF;
            --cyan-soft: #65F4FF;
            --pink: #FF2D95;
            --green: #42F59E;
            --green-dark: #00C875;
            --text-main: #F4FBFF;
            --text-secondary: #9EB7C7;
            --text-muted: #607988;
            --track: #14283A;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(0, 229, 255, 0.10) 0%,
                    rgba(0, 229, 255, 0.03) 30%,
                    transparent 58%
                ),
                radial-gradient(
                    circle at 80% 15%,
                    rgba(255, 45, 149, 0.08) 0%,
                    transparent 40%
                ),
                linear-gradient(
                    180deg,
                    #06101D 0%,
                    #020713 100%
                );

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: var(--text-main);
        }

        .dialog-container {

            position: relative;

            width: 100%;
            height: 100%;

            padding:
                28px
                22px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 31, 0.78),
                    rgba(2, 7, 19, 0.96)
                );

            overflow: hidden;
        }

        .dialog-container::before {

            content: '';

            position: absolute;

            top: 0;
            left: 8%;
            right: 8%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    var(--pink),
                    transparent
                );

            box-shadow:
                0 0 12px rgba(0, 229, 255, 0.8),
                0 0 22px rgba(255, 45, 149, 0.35);
        }

        .dialog-container::after {

            content: '';

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 229, 255, 0.08) 0%,
                    rgba(0, 229, 255, 0.025) 42%,
                    transparent 72%
                );

            filter: blur(8px);

            pointer-events: none;
        }

        .file-name {

            position: relative;

            z-index: 2;

            color: var(--text-secondary);

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 1.3px;

            margin-bottom: 8px;

            text-shadow:
                0 0 8px rgba(0, 229, 255, 0.15);
        }

        .progress-circle-container {

            position: relative;

            z-index: 2;

            display: flex;

            justify-content: center;
            align-items: center;

            margin:
                8px
                0
                12px
                0;
        }

        svg {

            width: 280px;
            height: 280px;

            transform: rotate(-90deg);

            overflow: visible;

            filter:
                drop-shadow(
                    0
                    0
                    5px
                    rgba(0, 229, 255, 0.18)
                );
        }

        .progress-background {

            fill: none;

            stroke: var(--track);

            stroke-width: 18;

            stroke-linecap: round;
        }

        .progress-outline {

            fill: none;

            stroke:
                rgba(
                    0,
                    229,
                    255,
                    0.09
                );

            stroke-width: 1;

            stroke-dasharray:
                3
                5;
        }

        .progress-fill {

            fill: none;

            stroke-width: 18;

            stroke-linecap: round;

            stroke: url(#progressGradient);

            transition:
                stroke-dashoffset
                0.25s
                ease;

            filter:
                drop-shadow(
                    0
                    0
                    5px
                    rgba(0, 229, 255, 0.75)
                )
                drop-shadow(
                    0
                    0
                    10px
                    rgba(255, 45, 149, 0.30)
                );
        }

        .progress-fill.completed {

            stroke:
                url(
                    #completedGradient
                );

            filter:
                drop-shadow(
                    0
                    0
                    6px
                    rgba(66, 245, 158, 0.85)
                )
                drop-shadow(
                    0
                    0
                    13px
                    rgba(0, 200, 117, 0.35)
                );
        }

        .progress-text {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            text-align: center;

            z-index: 3;
        }

        .progress-label {

            color:
                var(
                    --text-secondary
                );

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1.6px;

            margin-bottom: 10px;

            min-width: 170px;

            height: 22px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-transform: uppercase;
        }

        .progress-label.completed {

            color:
                var(
                    --green
                );

            text-shadow:
                0
                0
                8px
                rgba(
                    66,
                    245,
                    158,
                    0.45
                );
        }

        .dot {

            display: inline-block;

            width: 4px;
            height: 4px;

            background-color:
                var(
                    --cyan
                );

            border-radius: 50%;

            margin:
                0
                3px;

            box-shadow:
                0
                0
                5px
                rgba(
                    0,
                    229,
                    255,
                    0.8
                );

            animation:
                blink
                1.4s
                infinite;
        }

        .dot:nth-child(2) {
            animation-delay:
                0.2s;
        }

        .dot:nth-child(3) {
            animation-delay:
                0.4s;
        }

        .progress-label.completed
        .dot {
            display: none;
        }

        @keyframes blink {

            0%,
            60%,
            100% {

                opacity: 0.25;

                transform:
                    scale(
                        0.85
                    );
            }

            30% {

                opacity: 1;

                transform:
                    scale(
                        1.15
                    );
            }
        }

        .progress-percentage {

            color:
                var(
                    --cyan
                );

            font-size: 64px;

            font-weight: 800;

            line-height: 1;

            letter-spacing:
                -3px;

            text-shadow:
                0
                0
                8px
                rgba(
                    0,
                    229,
                    255,
                    0.60
                ),
                0
                0
                18px
                rgba(
                    0,
                    229,
                    255,
                    0.20
                );
        }

        .progress-text.completed
        .progress-percentage {

            color:
                var(
                    --green
                );

            text-shadow:
                0
                0
                8px
                rgba(
                    66,
                    245,
                    158,
                    0.65
                ),
                0
                0
                18px
                rgba(
                    66,
                    245,
                    158,
                    0.20
                );
        }

        .separator {

            position: relative;

            z-index: 2;

            width: 80%;

            height: 1px;

            margin:
                15px
                0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(
                        0,
                        229,
                        255,
                        0.4
                    ),
                    rgba(
                        255,
                        45,
                        149,
                        0.25
                    ),
                    transparent
                );

            box-shadow:
                0
                0
                7px
                rgba(
                    0,
                    229,
                    255,
                    0.15
                );
        }

        .info-text {

            position: relative;

            z-index: 2;

            color:
                var(
                    --text-muted
                );

            font-size: 12px;

            font-weight: 500;

            letter-spacing:
                0.7px;
        }

        @media (max-width: 380px) {

            .dialog-container {
                padding:
                    20px
                    15px;
            }

            svg {
                width: 235px;
                height: 235px;
            }

            .progress-percentage {
                font-size: 52px;
            }

            .progress-label {
                font-size: 11px;
            }

            .file-name {
                font-size: 12px;
            }
        }

    </style>

</head>

<body>

<div class="dialog-container">

    <div
            class="file-name"
            id="fileName"
    >
        FingerDance.zip
    </div>

    <div class="progress-circle-container">

        <svg viewBox="0 0 200 200">

            <defs>

                <linearGradient
                        id="progressGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                >

                    <stop
                            offset="0%"
                            style="
                            stop-color:#00E5FF;
                            stop-opacity:1
                        "
                    />

                    <stop
                            offset="58%"
                            style="
                            stop-color:#65F4FF;
                            stop-opacity:1
                        "
                    />

                    <stop
                            offset="100%"
                            style="
                            stop-color:#FF2D95;
                            stop-opacity:1
                        "
                    />

                </linearGradient>

                <linearGradient
                        id="completedGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                >

                    <stop
                            offset="0%"
                            style="
                            stop-color:#42F59E;
                            stop-opacity:1
                        "
                    />

                    <stop
                            offset="100%"
                            style="
                            stop-color:#00C875;
                            stop-opacity:1
                        "
                    />

                </linearGradient>

            </defs>

            <circle
                    class="progress-outline"
                    cx="100"
                    cy="100"
                    r="88"
            ></circle>

            <circle
                    class="progress-background"
                    cx="100"
                    cy="100"
                    r="75"
            ></circle>

            <circle
                    class="progress-fill"
                    id="progressCircle"
                    cx="100"
                    cy="100"
                    r="75"
            ></circle>

        </svg>

        <div
                class="progress-text"
                id="progressText"
        >

            <div
                    class="progress-label"
                    id="progressLabel"
            >

                <span id="labelText">
                    Descargando
                </span>

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

            <div
                    class="progress-percentage"
                    id="progressPercentage"
            >
                0%
            </div>

        </div>

    </div>

    <div class="separator"></div>

    <div class="info-text">
        Por favor, no cierres la aplicación
    </div>

</div>

<script>

    const radius = 75;

    const circumference =
        2 *
        Math.PI *
        radius;

    const progressCircle =
        document.getElementById(
            'progressCircle'
        );

    const progressPercentage =
        document.getElementById(
            'progressPercentage'
        );

    const fileNameElement =
        document.getElementById(
            'fileName'
        );

    const progressLabel =
        document.getElementById(
            'progressLabel'
        );

    const progressText =
        document.getElementById(
            'progressText'
        );

    const labelText =
        document.getElementById(
            'labelText'
        );

    progressCircle.style.strokeDasharray =
        circumference;

    progressCircle.style.strokeDashoffset =
        circumference;

    function updateProgress(progress) {

        progress =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(progress)
                )
            );

        const offset =
            circumference -
            (
                progress /
                100
            ) *
            circumference;

        progressCircle.style.strokeDashoffset =
            offset;

        progressPercentage.textContent =
            Math.round(
                progress
            ) +
            '%';

        if (
            progress >= 100
        ) {

            progressCircle
                .classList
                .add(
                    'completed'
                );

            progressLabel
                .classList
                .add(
                    'completed'
                );

            progressText
                .classList
                .add(
                    'completed'
                );

            labelText.textContent =
                '¡Completado!';

        } else {

            progressCircle
                .classList
                .remove(
                    'completed'
                );

            progressLabel
                .classList
                .remove(
                    'completed'
                );

            progressText
                .classList
                .remove(
                    'completed'
                );

            labelText.textContent =
                'Descargando';
        }
    }

    function setFileName(name) {

        fileNameElement.textContent =
            name;
    }

</script>

</body>

</html>
